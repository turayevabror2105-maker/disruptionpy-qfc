name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"     # weekly, so the integration job sees changes in DisruptionPy or MAST's data server
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The default group: no dataset, no network. Includes the identity tests against the paper's reference code.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not slow and not integration" -q -rs

  oldest:
    # The lowest dependency versions pyproject.toml allows, so the declared floors are tested, not assumed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install "numpy==1.24.4" "pandas==2.0.3" "scikit-learn==1.3.2" "scipy==1.10.1" "shap==0.45.1" pytest
      - run: pip install -e . --no-deps
      - run: pytest -m "not slow and not integration" -q -rs

  wheel:
    # The built wheel, installed as a user would install it, with src/ kept off the import path.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: pip install dist/*.whl pytest
      - run: python -c "import disruptionpy_qfc, sys; assert 'site-packages' in disruptionpy_qfc.__file__, disruptionpy_qfc.__file__"
      - run: mv src src_hidden && pytest -o pythonpath= -m "not slow and not integration" -q -rs

  integration:
    # A real DisruptionPy frame, built from MAST's open data by DisruptionPy itself. DPQ_REQUIRE_FRAME=1 turns a
    # missing frame into a failure, so these four tests cannot silently skip here. Not run on pull requests, to keep
    # load off the public data server.
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" "disruption-py==0.14.0"
      - run: python tests/fixtures/build_mast_frame.py --out mast_frame.csv --n-shots 24 --processes 4
      - run: pytest -m integration -v -rs
        env:
          DISRUPTIONPY_FRAME: mast_frame.csv
          DPQ_TUD_COL: time_until_end_of_current
          DPQ_REQUIRE_FRAME: "1"
