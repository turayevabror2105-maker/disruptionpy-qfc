[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disruptionpy-qfc"
version = "2.0.0"
description = "Attribution-stability screening (QFC) for DisruptionPy-format fusion shot data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abror Turayev" }]
keywords = ["fusion", "tokamak", "disruption", "interpretability", "shap", "distribution shift"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.2", "scipy>=1.9", "shap>=0.42"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/turayevabror2105-maker/disruptionpy-qfc"
Issues = "https://github.com/turayevabror2105-maker/disruptionpy-qfc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/disruptionpy_qfc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: without this, `pytest` in a fresh clone fails at collection with
# ModuleNotFoundError before running a single test, because src/ is not on sys.path and the
# package is not installed. Verified 2026-09-16: that is exactly what happened.
pythonpath = ["src"]
markers = ["slow: requires the C-Mod dataset and minutes of CPU"]
