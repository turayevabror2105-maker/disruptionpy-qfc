[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disruptionpy-qfc"
version = "3.0.1"
description = "Attribution-stability screening (QFC) for DisruptionPy-format fusion shot data, with the verdict procedure of the paper that defines it"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abror Turayev" }]
keywords = ["fusion", "tokamak", "disruption", "interpretability", "shap", "distribution shift"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "shap>=0.45"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/turayevabror2105-maker/disruptionpy-qfc"
Issues = "https://github.com/turayevabror2105-maker/disruptionpy-qfc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/disruptionpy_qfc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: lets `pytest` run from a fresh clone before the package is installed
pythonpath = ["src"]
markers = [
  "slow: recomputes the worked example from the C-Mod release (set DL_DATAFRAME); about ten minutes on 32 cores",
  "integration: needs a frame produced by DisruptionPy (set DISRUPTIONPY_FRAME); CI builds one from MAST's open data",
]
